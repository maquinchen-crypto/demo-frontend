# Proxy de nginx hacia el backend Spring Boot.
# Copiar a /etc/nginx/default.d/demo.conf y reemplazar IP_PRIVADA_BACK
# por la IP privada de ec2-back.
location ~ ^/(api|swagger-ui|v3/api-docs|h2-console) {
    proxy_pass http://IP_PRIVADA_BACK:8080;
    proxy_set_header Host $host:$server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
